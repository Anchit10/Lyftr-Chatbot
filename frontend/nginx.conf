# Nginx serves the built React app (static files) inside the frontend container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: always fall back to index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
